name: signaldesk
version: "0.2.0"
description: "Draft-first lead desk: scan public hiring and launch signals (HN Who is hiring, YC hiring, Show HN, new YC companies) and local businesses on an OpenStreetMap map (LocalLead Map), score them against your ICP, draft outreach, and never send without in-plugin approval. Cron and unattended runs fail closed."
author: codeybot-labs
license: MIT
homepage: https://github.com/codeybot-labs/signaldesk
requires_hermes: ">=0.22.0"
provides_tools:
  - signaldesk_set_icp
  - signaldesk_scan
  - signaldesk_list
  - signaldesk_draft
  - signaldesk_approve
  - signaldesk_mark
  - signaldesk_followups
  - signaldesk_export_csv
  - signaldesk_sources
  - signaldesk_prepare_send
  - signaldesk_board
  - signaldesk_map_scan
provides_hooks:
  - pre_tool_call
config_schema:
  sender_name:
    type: str
    default: ""
    description: "Name signed at the end of outreach drafts."
  offer:
    type: str
    default: ""
    description: "One sentence describing what you sell, used in drafts and scoring context."
  booking_link:
    type: str
    default: ""
    description: "Optional public booking URL included in drafts."

optional_env:
  - name: PRODUCTHUNT_TOKEN
    description: "Optional Product Hunt GraphQL v2 token. Leave unset to keep the Product Hunt source disabled. Product Hunt API terms restrict commercial use without permission."
    password: true

